<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk / Kicau</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="login-page">

  <section class="brand">
    <div class="brand-logo">Kicau</div>
    <h1>Lihat apa yang sedang terjadi di sekitarmu.</h1>
    <p class="muted">Ikuti teman, bagikan kabar, dan ngobrol langsung dengan mereka.</p>
  </section>

  <main class="login-box">
    <h2>Masuk ke Kicau</h2>

    <form class="login-form" action="home.html">
      <label for="user">Email atau nama pengguna</label>
      <input id="user" type="text" name="user" placeholder="contoh: rakapratama" required>

      <label for="pass">Kata sandi</label>
      <input id="pass" type="password" name="pass" placeholder="Masukkan kata sandi" required>

      <div class="row">
        <label class="check"><input type="checkbox" name="ingat"> Ingat saya</label>
        <a class="link" href="#">Lupa kata sandi?</a>
      </div>

      <button type="submit" class="btn">Masuk</button>
    </form>

    <div class="divider"><span>atau</span></div>

    <a class="btn line" href="#">Buat akun baru</a>
    <p class="note muted">Dengan masuk, Anda menyetujui Ketentuan Layanan dan Kebijakan Privasi Kicau.</p>
  </main>

</div>
</body>
</html>
